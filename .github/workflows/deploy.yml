name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/webar-hand-tracking-vite-03pxkn
  workflow_dispatch:

# Permisos mínimos requeridos por la acción oficial de GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados: cancela el anterior si llega uno nuevo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (Vite)
        run: npm run build
        env:
          # Sirve la app bajo /<nombre-del-repo>/ en GitHub Pages.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
